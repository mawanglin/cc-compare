name: Build & Package

on:
  push:
    branches: [feature/ci-multi-platform-packaging]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 5.15.2
  APP_VERSION: 1.26.0

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libuchardet-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 fuse libfuse2

      - name: Build QScintilla static lib
        run: |
          cd src/qscint/src
          qmake qscintilla.pro
          make -j$(nproc)
          test -f ../../x64/Release/libqmyedit_qt5.a

      - name: Build CCompare
        run: |
          cd src
          cp mac/LINUXRealCompare.pro ./LINUXRealCompare.pro
          qmake LINUXRealCompare.pro
          make -j$(nproc)
          ls -la x64/Release/

      - name: Stage app tree
        run: |
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE/usr/bin" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/256x256/apps"
          cp src/x64/Release/CCompare "$STAGE/usr/bin/"
          cp packaging/cc-compare.desktop "$STAGE/usr/share/applications/"
          cp packaging/cc-compare.png \
             "$STAGE/usr/share/icons/hicolor/256x256/apps/cc-compare.png"

      - name: Build .deb
        run: |
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE/DEBIAN"
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: cc-compare
          Version: ${{ env.APP_VERSION }}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: cc-compare CI <ci@example.com>
          Description: A free code comparison tool
          EOF
          dpkg-deb --build "$STAGE" "CCompare-ubuntu.deb"

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable src/x64/Release/CCompare \
            --desktop-file packaging/cc-compare.desktop \
            --icon-file packaging/cc-compare.png \
            --plugin qt \
            --output appimage
          mv cc_compare-*.AppImage CCompare-ubuntu.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: |
            CCompare-ubuntu.deb
            CCompare-ubuntu.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build QScintilla static lib
        shell: cmd
        run: |
          cd src\qscint\src || exit /b 1
          qmake qscintilla.pro || exit /b 1
          nmake || exit /b 1
          if not exist ..\..\x64\Release\qmyedit_qt5.lib exit /b 1

      - name: Build CCompare
        shell: cmd
        run: |
          cd src || exit /b 1
          qmake RealCompare.pro || exit /b 1
          nmake || exit /b 1
          if not exist x64\Release\CCompare.exe exit /b 1
          dir x64\Release

      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        run: |
          cd src\x64\Release || exit /b 1
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw CCompare.exe || exit /b 1
          echo --- windeployqt output ---
          dir

      - name: Copy MSVC runtime DLLs
        shell: pwsh
        run: |
          $dest = "src\x64\Release"
          $names = @('vcomp140.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll')
          $redist = $env:VCToolsRedistDir
          if (-not $redist) { throw "VCToolsRedistDir not set; msvc-dev-cmd did not initialize env." }
          Write-Host "VCToolsRedistDir = $redist"
          foreach ($n in $names) {
            $hit = Get-ChildItem -Path $redist -Recurse -Filter $n -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if (-not $hit) { throw "Could not find $n under $redist" }
            Write-Host "Copy $($hit.FullName) -> $dest"
            Copy-Item $hit.FullName -Destination $dest -Force
          }

      - name: List Release dir before packaging
        shell: cmd
        run: |
          dir src\x64\Release
          echo --- subdirs ---
          for /d %%D in (src\x64\Release\*) do echo DIR %%D

      - name: Build NSIS installer
        shell: cmd
        run: |
          cd src\installer || exit /b 1
          makensis installer.nsi || exit /b 1
          dir CCompare-v*-x64-Installer.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: src/installer/CCompare-v*-x64-Installer.exe

  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64

      - name: Install build deps
        run: brew install uchardet

      - name: Build QScintilla static lib
        run: |
          cd src/qscint/src
          qmake qscintilla.pro
          make -j$(sysctl -n hw.ncpu)
          test -f ../../x64/Release/libqmyedit_qt5.a

      - name: Build CCompare
        run: |
          cd src
          cp mac/LINUXRealCompare.pro ./LINUXRealCompare.pro
          UC=$(brew --prefix uchardet)
          qmake "INCLUDEPATH+=$UC/include $UC/include/uchardet" \
                "LIBS+=-L$UC/lib" \
                LINUXRealCompare.pro
          make -j$(sysctl -n hw.ncpu)
          ls -la x64/Release/

      - name: Build .dmg
        run: |
          cd src/x64/Release
          ls -la
          macdeployqt CCompare.app -dmg
          mv CCompare.dmg "$GITHUB_WORKSPACE/CCompare-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: CCompare-macos.dmg
